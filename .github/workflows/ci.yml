name: CI

# Code-quality gate. No launch:check here, so CI stays green while launch content is pending.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Yarn 4 comes from the packageManager field via Corepack; enable it before setup-node's cache step.
      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn format:check
      - run: yarn test
      - run: yarn i18n:check
      - run: yarn build
