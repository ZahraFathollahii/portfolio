name: Deploy to GitHub Pages

on:
  # Manual only until the first successful launch.
  workflow_dispatch:
    inputs:
      skip_launch_check:
        description: "Deploy even if launch content is missing"
        type: boolean
        default: false
  # Enable after launch to deploy every push to main:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that's in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --immutable

      # Fails while launch content is missing (email, resume PDF, role/scope TODOs).
      - if: ${{ !inputs.skip_launch_check }}
        run: yarn launch:check

      - run: yarn build

      # Fails if any "TODO" text reached a generated page.
      - if: ${{ !inputs.skip_launch_check }}
        run: yarn launch:check --built

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
